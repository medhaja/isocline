name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: "Include the error message and the request id (X-Request-ID) if there is one." }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce, description: "A minimal workflow JSON (export it; secrets are stripped) helps a lot." }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behaviour }
  - type: input
    id: version
    attributes: { label: Isocline version or commit, placeholder: "3.3.0 / GET /api/v1/meta" }
    validations: { required: true }
  - type: dropdown
    id: deploy
    attributes: { label: Deployment, options: [Docker Compose, Local processes (scripts/dev-stack.sh), Other] }
  - type: textarea
    id: logs
    attributes: { label: Relevant logs, render: text, description: "api / worker / beat logs. Remove secrets." }
