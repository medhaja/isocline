# Proves the desktop Python sandbox on real Windows whenever it changes: builds the sandbox runtime and runs the
# escape tests (read user files, network, localhost, child processes, limits). Any escape fails the check.
name: Desktop sandbox

on:
  pull_request:
    paths:
      - apps/api/isocline/desktop/sandbox/**
      - workers/python-sandbox/harness.py
      - packaging/desktop/build.ps1
      - packaging/desktop/tests/**
      - .github/workflows/desktop-sandbox.yml
  push:
    branches: [main]
    paths:
      - apps/api/isocline/desktop/sandbox/**
      - workers/python-sandbox/harness.py
      - packaging/desktop/build.ps1
      - packaging/desktop/tests/**
      - .github/workflows/desktop-sandbox.yml
  workflow_dispatch:

jobs:
  windows-isolation:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: apps/api/requirements-desktop.txt }
      - name: Build the sandbox runtime and run the escape tests
        shell: pwsh
        run: packaging\desktop\build.ps1 -SandboxOnly
