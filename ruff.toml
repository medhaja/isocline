# Lint gate for CI: correctness rules only (syntax errors, undefined names, unused/duplicate imports).
# Formatting is not enforced repository-wide yet (the codebase predates a formatter); new code should follow the
# surrounding style. Tightening this is a good first contribution.
line-length = 140
target-version = "py312"
extend-exclude = ["apps/api/alembic/versions", "apps/web", "tests/e2e"]

[lint]
select = ["E9", "F63", "F7", "F82", "F401", "F811"]
